<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Faculty dashboard</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body data-page="faculty">
    <main class="shell">
      <header class="toolbar">
        <div>
          <p class="eyebrow">AgriLearn staff portal</p>
          <h1>Faculty dashboard</h1>
          <p id="staff-name" class="muted"></p>
        </div>
        <button id="logout" class="secondary">Sign out</button>
      </header>
      <div class="stats">
        <div class="stat">
          <span id="student-count" class="stat-value">0</span>
          <span class="stat-label">Students</span>
        </div>
        <div class="stat">
          <span class="stat-value">Reports</span>
          <span class="stat-label">Learning progress</span>
        </div>
      </div>
      <section class="card wide-card">
        <h2>Student learning records</h2>
        <p class="form-hint">Review synchronized student profiles, activity scores, module progress, bookmarks, and achievements.</p>
        <div class="student-filter">
          <label for="student-filter">Filter by student user ID</label>
          <select id="student-filter">
            <option value="">All students</option>
          </select>
        </div>
        <div id="students"></div>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
