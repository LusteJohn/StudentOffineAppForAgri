<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin portal</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body data-page="admin">
    <main class="shell">
      <header class="toolbar">
        <div>
          <p class="eyebrow">AgriLearn staff portal</p>
          <h1>Admin dashboard</h1>
          <p id="staff-name" class="muted"></p>
        </div>
        <button id="logout" class="secondary">Sign out</button>
      </header>
      <div class="stats">
        <div class="stat"><span id="student-count" class="stat-value">0</span><span class="stat-label">Students</span></div>
        <div class="stat"><span class="stat-value">Faculty</span><span class="stat-label">Account management</span></div>
      </div>
      <section class="card">
        <h2>Register faculty member</h2>
        <p class="form-hint">Create a faculty account for the student learning portal.</p>
        <form id="faculty-form">
          <label for="username">Username</label>
          <input id="username" name="username" required>
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required>
          <label for="password">Temporary password</label>
          <input id="password" name="password" type="password" required>
          <p id="message" role="status" aria-live="polite"></p>
          <button type="submit">Create faculty account</button>
        </form>
      </section>
      <section class="card">
        <h2>Student learning records</h2>
        <p class="form-hint">Review records synchronized from the offline student application.</p>
        <div id="students"></div>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
